name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '11'
      - name: Build, test, and package Java 8-compatible plugin
        run: |
          set -euo pipefail
          bash scripts/build.sh
          cp output/packages/SHA256SUMS /tmp/tmdb-first-SHA256SUMS
          bash scripts/build.sh
          cmp /tmp/tmdb-first-SHA256SUMS output/packages/SHA256SUMS
      - name: Reject private credentials and cache data
        run: |
          set -euo pipefail
          ! find . -type f \( -name 'tmdb_config.toml' -o -name '*.sqlite3' -o -name '*.sqlite3-shm' -o -name '*.sqlite3-wal' \) -print -quit | grep -q .
          python3 - <<'PY'
          import pathlib
          import tomllib

          example = tomllib.loads(pathlib.Path("tmdb_config.example.toml").read_text(encoding="utf-8"))
          assert example["tmdb"]["api_key"] == "", "example configuration must not contain a credential"
          PY
      - uses: actions/upload-artifact@v7
        with:
          name: opensagetv-vibe-tmdb-${{ github.sha }}
          path: output/packages/
          if-no-files-found: error
          retention-days: 14
